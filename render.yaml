services:
  - type: web
    name: parabellum-api
    runtime: python
    plan: free                
    region: frankfurt         
    buildCommand: pip install -r backend/requirements.txt
    startCommand: >
      uvicorn api.main:app
      --host 0.0.0.0
      --port $PORT
      --app-dir backend/src
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.4"
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
